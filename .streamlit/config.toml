[theme]
base = "light"
backgroundColor = "#E8E3DA"          # 바탕 (베이지)
secondaryBackgroundColor = "#F5F1EA" # 옆 메뉴·입력칸
primaryColor = "#4A4440"             # 버튼·선택 (차콜 모노톤)
textColor = "#3A2E2A"

[client]
toolbarMode = "viewer"               # Deploy 버튼 숨김

[browser]
gatherUsageStats = false             # 사용 통계를 밖으로 보내지 않음

[server]
headless = true
address = "0.0.0.0"                  # 같은 와이파이의 팀원도 접속 가능 (http://내IP:8502)
